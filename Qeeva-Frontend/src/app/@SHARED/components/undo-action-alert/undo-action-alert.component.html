@if (state(); as alert) {
  <aside
    class="undo-alert"
    [class.position-top]="alert.position === 'top'"
    [class.position-bottom]="alert.position === 'bottom'"
    role="status"
    aria-live="polite"
  >
    <div class="undo-alert-progress" aria-hidden="true">
      <svg viewBox="0 0 42 42" role="presentation">
        <circle class="undo-alert-progress-track" cx="21" cy="21" r="16" />
        <circle
          class="undo-alert-progress-value"
          cx="21"
          cy="21"
          r="16"
          pathLength="100"
          [style.stroke-dashoffset]="100 - progressPercent()"
        />
      </svg>
      <span>{{ secondsRemaining() }}</span>
    </div>
    <div class="undo-alert-copy">
      <strong>{{ alert.message }}</strong>
      <span>Undo available for a few more seconds</span>
    </div>
    <button type="button" class="undo-alert-button" (click)="undo()">Undo</button>
    <button type="button" class="undo-alert-dismiss" aria-label="Dismiss undo alert" (click)="dismiss()">x</button>
  </aside>
}
