<div
  class="swipe-action-card"
  noSwipe
  [class.is-dragging]="isDragging()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerCancel()"
>
  <div
    class="swipe-action swipe-action-left"
    [class]="'swipe-action swipe-action-left tone-' + (leftAction?.tone ?? 'neutral')"
    [style.opacity]="actionOpacity(leftAction)"
    aria-hidden="true"
  >
    <span class="swipe-action-label">{{ leftAction?.label }}</span>
  </div>

  <div
    class="swipe-action swipe-action-right"
    [class]="'swipe-action swipe-action-right tone-' + (rightAction?.tone ?? 'neutral')"
    [style.opacity]="actionOpacity(rightAction)"
    aria-hidden="true"
  >
    <span class="swipe-action-label">{{ rightAction?.label }}</span>
  </div>

  <div class="swipe-action-content" [style.transform]="'translateX(' + offsetX() + 'px)'">
    <ng-content />
  </div>
</div>
