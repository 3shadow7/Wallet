[project]
name = "qeeva-backend"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["migrations", "manage.py", "core/asgi.py", "core/wsgi.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "DJ", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and hard-coded throwaway secrets.
"**/tests/**" = ["S101", "S105", "S106"]
"core/settings_test.py" = ["S105", "F403"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/", "^manage\\.py$", "^core/(asgi|wsgi)\\.py$"]

[tool.django-stubs]
django_settings_module = "core.settings_test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings_test"
python_files = ["test_*.py"]
addopts = "-ra"
